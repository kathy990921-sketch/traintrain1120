<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火車收集家</title>
<style>
:root{--sky:#29a8ff;--blue:#1b3fa0;--yellow:#ffc928;--red:#ee3b3b;--cream:#fff4cf;--ink:#16224d;--green:#3cb44b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--sky);color:var(--ink);overflow:hidden;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-weight:700;
 padding-top:env(safe-area-inset-top)}
#wrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
#stage{position:relative;width:min(100cqw,calc(100cqh*1058/1487));aspect-ratio:1058/1487;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stage{touch-action:none}
#zoom{position:absolute;left:50%;top:60%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:#000c;border:2px solid #fff8;border-radius:99px;padding:5px 8px;z-index:3}
#zoom[hidden]{display:none}
#zoom button{min-width:44px;height:38px;border:0;border-radius:99px;background:transparent;color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
#zoom button.on{background:var(--yellow);color:var(--ink)}
.zl{color:#fff;font-size:12px;min-width:36px;text-align:center}
#msg{position:absolute;left:18%;right:18%;top:30%;text-align:center;background:var(--cream);border-radius:18px;padding:14px;line-height:1.5}
#bar{height:calc(96px + env(safe-area-inset-bottom));padding:8px 16px env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-between;background:var(--blue)}
.side{width:64px;height:64px;border:0;border-radius:20px;background:var(--cream);color:var(--blue);font:inherit;font-size:13px;display:grid;place-items:center;cursor:pointer}
.side b{font-size:24px;line-height:1}
#shutter{width:80px;height:80px;border-radius:50%;border:0;cursor:pointer;padding:8px;
 background:repeating-conic-gradient(var(--yellow) 0 15deg,#222 15deg 30deg)}
#shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--red);border:4px solid #fff;transition:transform .1s}
#shutter:active i{transform:scale(.88)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sheet{position:fixed;z-index:15;inset:auto 0 0 0;max-height:78dvh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
 box-shadow:0 -6px 24px #0005;transform:translateY(110%);transition:transform .25s}
.sheet.on{transform:none}
.row{display:flex;gap:14px;align-items:flex-start}
.row img{width:84px;border-radius:12px;border:3px solid #fff}
h2{font-size:22px;line-height:1.3;color:var(--blue)}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;margin:4px 4px 4px 0}
.new{background:var(--red)}
.meter{height:12px;border-radius:9px;background:#0002;margin:10px 0 4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--green)}
ul{padding-left:20px;margin:8px 0;font-weight:600;line-height:1.6}
.adv{background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:600}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;min-height:48px;border:0;border-radius:16px;font:inherit;font-size:16px;cursor:pointer;background:var(--blue);color:#fff}
.btns .alt{background:var(--yellow);color:var(--ink)}
.spin{width:36px;height:36px;border:5px solid #0002;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
#book{position:fixed;inset:0;z-index:20;background:var(--sky);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 90px;display:none}
#book.on{display:block}
#book header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:22px;color:#fff}
#book header button{border:0;border-radius:14px;padding:10px 16px;font:inherit;background:var(--yellow);color:var(--ink);cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:1px solid #d3dce5;border-radius:14px;padding:8px;font-size:14px;box-shadow:0 2px 6px #0002}.card h4{font-size:16px;color:var(--blue);margin:8px 4px 2px}.card ul{font-size:13px;padding-left:20px;margin:2px 4px 6px}.gh{grid-column:1/-1;color:#fff;font-size:18px;margin-top:6px}.cr{display:block;font-size:11px;font-weight:600;color:#556;margin:2px 4px 4px;word-break:break-all}
.card .ph{aspect-ratio:1058/1487;border-radius:14px;background:#dbe7f1;display:grid;place-items:center;overflow:hidden;padding:4px}.card .ph{font-size:40px;color:#7a8da0}.card small{display:block;font-weight:600;color:#667;margin:0 4px 4px}.card.no{opacity:.8}.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.pick button{min-height:46px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;font:inherit;font-size:14px;cursor:pointer;padding:4px}.pick button:active{background:var(--blue);color:#fff}.card.wide{grid-column:1/-1}.card.wide .ph{aspect-ratio:auto;height:64px}.strip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 4px}.card .strip img{width:84px;height:auto;aspect-ratio:1058/1487;object-fit:cover;border-radius:8px}.pg{grid-column:1/-1;font-size:13px;color:#556;margin-top:4px}
.card img{width:100%;height:100%;object-fit:cover}
.card.no{opacity:.75}.card small{display:block;font-weight:600;color:#555}
@media (prefers-reduced-motion:reduce){.sheet,#shutter i{transition:none}.spin{animation-duration:3s}}
</style>
</head>

  <button id="shutter" aria-label="拍照"><i></i></button>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), frameImg = $('frame'), sheet = $('sheet');
let facing = 'environment', stream, win, classes = [], last = null;

/* ---------- 設定與辨識資料庫（內嵌） ---------- */
/* ---------- 小工具 ---------- */
function h(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function canvas(w, h2){ const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h2); return c; }
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

/* ---------- 相機 ---------- */
async function startCam(){
  const msg = $('msg');
  if(!navigator.mediaDevices?.getUserMedia){ msg.textContent = '這個瀏覽器無法開啟相機，請改用 HTTPS 網址或較新的瀏覽器。'; return; }
  try{
    stream?.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio:false,
      video:{ facingMode:{ ideal:facing }, width:{ ideal:1920 }, height:{ ideal:1080 } } });
    video.srcObject = stream; await video.play(); msg.hidden = true; setupZoom().catch(() => { buildZoom(); setZoom(1); });
  }catch(e){
    msg.hidden = false;
    msg.textContent = e.name === 'NotAllowedError' ? '需要允許使用相機，請到瀏覽器設定開啟權限後重新整理。' : '開啟相機失敗：' + e.message;
  }
}
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };

/* ---------- 拍照：相機畫面 + 邊框，輸出完整畫面 ---------- */
async function shoot(){
  const fw = frameImg.naturalWidth, fh = frameImg.naturalHeight, vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(fw/vw, fh/vh), dw = vw*s, dh = vh*s;      // cover：置中裁切、不變形
  const full = canvas(fw, fh), fx = full.getContext('2d');
  const z = zr.hw ? 1 : zoom, zw = dw*z, zh = dh*z;   // 數位變焦時裁切中央
  fx.drawImage(video, (fw-zw)/2, (fh-zh)/2, zw, zh);
  fx.drawImage(frameImg, 0, 0);
  const blob = await new Promise(r => full.toBlob(r, 'image/png'));
  const ts = canvas(240, 240*fh/fw); ts.getContext('2d').drawImage(full, 0, 0, ts.width, ts.height);
  const th = canvas(480, 480*fh/fw); th.getContext('2d').drawImage(full, 0, 0, th.width, th.height);
  return { blob, url: URL.createObjectURL(blob), thumb: th.toDataURL('image/jpeg', .75), thumbS: ts.toDataURL('image/jpeg', .7), name: `train_${stamp()}.png` };
}

function buttons(...list){
  const b = h('div', 'btns');
  list.forEach(([t, fn, cls]) => { const x = h('button', cls || '', t); x.onclick = fn; b.append(x); });
  return b;
}
function closeSheet(){ sheet.classList.remove('on'); }

$('shutter').onclick = async () => {
  if(!stream || !video.videoWidth) return;
  if(last?.url) URL.revokeObjectURL(last.url);
  last = await shoot();
  showPick();
};

/* ---------- 儲存與分享（存的是含邊框的完整畫面） ---------- */
function saveFile(){ const a = h('a'); a.href = last.url; a.download = last.name; document.body.append(a); a.click(); a.remove(); }
async function share(){
  const f = new File([last.blob], last.name, { type:'image/png' });
  if(navigator.canShare?.({ files:[f] })){ try{ await navigator.share({ files:[f], title:'火車收集家' }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  saveFile();
}

/* ---------- 收集圖鑑：拍照後選火車類型，照片存進圖鑑 ---------- */
const CLASSES = [{"id": "TZECHIANG", "name": "自強號", "group": "臺鐵火車"}, {"id": "CHUKUANG", "name": "莒光號", "group": "臺鐵火車"}, {"id": "DISTRICT", "name": "區間車", "group": "臺鐵火車"}, {"id": "METRO", "name": "捷運", "group": "其他交通"}, {"id": "HSR", "name": "高鐵", "group": "其他交通"}, {"id": "FERRY", "name": "渡輪", "group": "其他交通"}, {"id": "LRT", "name": "輕軌", "group": "其他交通"}, {"id": "PHOTO_DIRECTOR", "name": "與主任的合照", "group": "合照"}, {"id": "PHOTO_PRINCIPAL", "name": "與校長的合照", "group": "合照"}, {"id": "PHOTO_GROUP", "name": "小組自拍合照", "group": "合照"}, {"id": "CLASSMATES", "name": "我的同學", "group": "合照", "multi": true}, {"id": "QIJIN", "name": "我愛旗津", "group": "高雄行程"}, {"id": "KAOHSIUNG_PORT", "name": "我愛高雄港", "group": "高雄行程"}, {"id": "DANDAN", "name": "我的丹丹漢堡", "group": "高雄行程"}];
const loadBook = () => { try { return JSON.parse(localStorage.getItem('tc_book')) || {}; } catch { return {}; } };
const saveBook = b => { try { localStorage.setItem('tc_book', JSON.stringify(b)); return true; } catch { return false; } };
const preview = () => { const img = h('img'); img.src = last.url; img.alt = '剛拍的照片'; img.style.cssText = 'display:block;margin:8px auto;max-height:26dvh;max-width:100%;border-radius:12px;border:3px solid #fff'; return img; };

function showPick(){
  const pick = h('div', 'pick'); let g = '';
  CLASSES.forEach(c => {
    if(c.group !== g){ g = c.group; pick.append(h('div', 'pg', g)); }
    const b = h('button', '', c.name); b.onclick = () => collect(c); pick.append(b);
  });
  sheet.replaceChildren(h('h2', '', '拍好了！要收集成哪一類？'), preview(), pick,
    buttons(['儲存照片', saveFile], ['分享', share, 'alt'], ['先不收集', closeSheet, 'alt']));
  sheet.classList.add('on'); sheet.scrollTop = 0;
}

function collect(c){
  const book = loadBook(), date = new Date().toLocaleDateString('zh-TW'); let msg;
  if(c.multi){                                   // 可累積：每拍一張就新增一張，不覆蓋
    const arr = Array.isArray(book[c.id]) ? book[c.id] : [];
    arr.push({ date, thumb: last.thumbS }); book[c.id] = arr;
    msg = `已新增一張：${c.name}（共 ${arr.length} 張）`;
  }else{
    const again = !!book[c.id];
    book[c.id] = { date, thumb: last.thumb };
    msg = (again ? '已更新照片：' : '收集成功！') + c.name;
  }
  const ok = saveBook(book);
  sheet.replaceChildren(h('h2', '', ok ? msg : '存不進圖鑑（儲存空間不足）'), preview(),
    buttons(['看圖鑑', openBook], ['儲存照片', saveFile, 'alt'], ['繼續拍', closeSheet, 'alt']));
  sheet.scrollTop = 0;
}

function renderBook(){
  const book = loadBook(), grid = $('grid'); grid.replaceChildren();
  let g = '', n = 0;
  CLASSES.forEach(c => {
    if(c.group !== g){ g = c.group; grid.append(h('div', 'gh', g)); }
    const got = book[c.id], list = c.multi ? (Array.isArray(got) ? got : []) : null, has = c.multi ? list.length > 0 : !!got;
    const card = h('div', 'card' + (c.multi ? ' wide' : '') + (has ? '' : ' no'));
    if(has) n++;
    if(c.multi && has){
      const strip = h('div', 'strip');
      list.forEach(x => { const im = h('img'); im.src = x.thumb; im.alt = c.name; strip.append(im); });
      card.append(h('h4', '', `${c.name}（${list.length} 張）`), strip);
    }else{
      const ph = h('div', 'ph');
      if(has){ const im = h('img'); im.src = got.thumb; im.alt = c.name; ph.append(im); } else ph.textContent = '?';
      card.append(ph, h('h4', '', c.name), h('small', '', has ? got.date : '尚未收集'));
    }
    grid.append(card);
  });
  $('count').textContent = `我的圖鑑 ${n} / ${CLASSES.length}`;
}
function openBook(){ closeSheet(); renderBook(); $('book').classList.add('on'); $('zoom').hidden = true; }
$('open').onclick = openBook;
$('close').onclick = () => { $('book').classList.remove('on'); $('zoom').hidden = false; };

/* ---------- 變焦：優先用鏡頭硬體變焦，不支援時改用數位變焦；支援雙指縮放 ---------- */
let zoom = 1, zr = { hw:false, min:1, max:4 };
async function setupZoom(){
  const t = stream.getVideoTracks()[0], caps = t.getCapabilities?.() || {};
  zr = { hw:false, min:1, max:4 };
  video.style.transform = '';
  // 有些手機宣告支援硬體變焦，實際卻沒有效果：先試一次，沒有反應就改用數位變焦
  if(caps.zoom && caps.zoom.max > 1.1){
    const test = Math.min(2, caps.zoom.max);
    try{
      await t.applyConstraints({ advanced:[{ zoom:test }] });
      await new Promise(r => setTimeout(r, 250));
      const ok = Math.abs((t.getSettings().zoom || 1) - test) < .2;
      await t.applyConstraints({ advanced:[{ zoom:caps.zoom.min }] }).catch(() => {});
      if(ok) zr = { hw:true, min:caps.zoom.min, max:Math.min(caps.zoom.max, 8) };
    }catch{}
  }
  buildZoom(); setZoom(1);
}
// 變焦按鈕：開啟網頁就顯示（不用等相機），相機開啟後再依鏡頭能力調整
function buildZoom(){
  const box = $('zoom'); box.replaceChildren();
  [0.5, 1, 2, 3, 5].filter(z => z >= zr.min - .01 && z <= zr.max + .01).forEach(z => {
    const b = h('button', '', z + '×'); b.dataset.z = z; b.onclick = () => setZoom(z); box.append(b);
  });
  const l = h('span', 'zl'); l.id = 'zlabel'; box.append(l);
}
function setZoom(z){
  zoom = Math.max(zr.min, Math.min(zr.max, z));
  if(zr.hw) stream.getVideoTracks()[0].applyConstraints({ advanced:[{ zoom }] }).catch(() => {});
  else video.style.transform = `scale(${zoom})`;
  $('zoom').querySelectorAll('button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.z - zoom) < .05));
  $('zlabel').textContent = zoom.toFixed(1) + '×';
}
const tdist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
let pd = 0, pz = 1;
$('stage').addEventListener('touchstart', e => { if(e.touches.length === 2){ pd = tdist(e); pz = zoom; } }, { passive:true });
$('stage').addEventListener('touchmove', e => { if(e.touches.length === 2 && pd){ e.preventDefault(); setZoom(pz * tdist(e) / pd); } }, { passive:false });
$('stage').addEventListener('touchend', e => { if(e.touches.length < 2) pd = 0; });

/* ---------- 啟動 ---------- */
buildZoom(); setZoom(1);
(async () => { await frameImg.decode(); startCam(); })();
</script>
